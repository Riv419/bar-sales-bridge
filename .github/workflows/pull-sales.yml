name: Pull bar sales (Tique's, Paddle, Volstead)

# Runs on GitHub's servers, which CAN reach the Square API, and commits the
# numbers into wrap.json / days/*.json / paddle_volstead.json.
#
# HOW IT GETS STARTED (two ways, belt and suspenders):
#   1. The always-on Mac mini pokes GitHub at exact times (mac/install.sh sets
#      that up). That arrives here as "workflow_dispatch" and runs immediately.
#   2. GitHub's own schedule below is only a BACKUP. GitHub delays or skips
#      scheduled runs on free repos whenever it's busy — we saw it fire 3-4
#      times a day instead of every 30 minutes — so never rely on it alone.

on:
  workflow_dispatch: {}   # run by hand from the Actions tab, or by the Mac mini
  schedule:
    # Times are UTC (EDT = UTC-4, EST = UTC-5). Odd minutes are less congested
    # on GitHub's scheduler than :00 / :30.
    - cron: "17,47 20-23 * * *"   # ~4 PM – 8 PM ET
    - cron: "17,47 0-3 * * *"     # ~8 PM – midnight ET
    - cron: "53 4 * * *"          # 12:53 AM EDT backup for the 1 AM wrap
    - cron: "23 5 * * *"          # 1:23 AM EDT — a second chance if the above slipped

# Allow the job to commit the updated JSON back to the repo.
permissions:
  contents: write

# If two runs overlap, queue them rather than run at the same time.
concurrency:
  group: pull-sales
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Pull sales
        env:
          SQUARE_TIQUES_TOKEN: ${{ secrets.SQUARE_TIQUES_TOKEN }}
          SQUARE_PADDLE_TOKEN: ${{ secrets.SQUARE_PADDLE_TOKEN }}
          SQUARE_VOLSTEAD_TOKEN: ${{ secrets.SQUARE_VOLSTEAD_TOKEN }}
        run: python pull_sales.py

      - name: Commit the updated numbers
        run: |
          git config user.name "sales-bridge-bot"
          git config user.email "sales-bridge-bot@users.noreply.github.com"
          git add wrap.json paddle_volstead.json days/
          if git diff --staged --quiet; then
            echo "No change in sales numbers; nothing to commit."
          else
            git commit -m "Update bar sales ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main || true
            git push
          fi
